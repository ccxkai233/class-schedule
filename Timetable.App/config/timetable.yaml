# 电子课程表配置（可直接修改本文件生效）
# 注意：YAML 缩进使用两个空格，不要使用 Tab。

meta:                           # 元信息
  timezone: "Asia/Shanghai"     # 时区，仅展示用
  theme: "dark"                 # dark / light
  accent_color: "#5C6BC0"       # 主色
  start_date: "2025-11-05"      # 轮换起始日期（用于取模计算）
  speech_voice: "ZH-CN"         # 语音引擎（系统默认即可）
  pre_alert_minutes: [3, 0]      # 开始前 N 分钟提醒
  post_alert_minutes: [0]       # 结束后 N 分钟提醒 (0 表示准时结束时提醒)
  show_window_on_reminder: true # 在提醒时是否自动弹出主窗口

subjects:                       # 课程科目清单（id 用于引用）
  - { id: math,  name: "数学" }
  - { id: eng,   name: "英语" }
  - { id: pol,   name: "政治" }
  - { id: cs_ds, name: "408-数据结构" }
  - { id: cs_os, name: "408-操作系统" }
  - { id: cs_cn, name: "408-计算机网络" }
  - { id: cs_ca, name: "408-计算机组成原理" }
  - { id: lunch, name: "午饭 🍱" }
  - { id: dinner, name: "晚饭 🍚" }
  - { id: nap,   name: "午休 😴" }

# 一天内的时间段定义（可自定义增删改）
# time 使用 24 小时制，闭开区间 [start, end)
slots:
  - { id: t1, start: "08:00", end: "09:00" }
  - { id: t2, start: "09:10", end: "10:00" }
  - { id: t3, start: "10:10", end: "11:00" }
  - { id: lunch, start: "11:00", end: "11:50" }
  - { id: t4, start: "11:50", end: "12:50" }
  - { id: t5, start: "13:00", end: "14:00" }
  - { id: t6, start: "14:00", end: "14:30" }
  - { id: nap, start: "14:30", end: "15:10" }
  - { id: t7, start: "15:10", end: "16:10" }
  - { id: t8, start: "16:20", end: "17:20" }
  - { id: t9, start: "17:20", end: "18:10" }
  - { id: dinner, start: "18:10", end: "19:00" }
  - { id: t10, start: "19:10", end: "20:10" }
  - { id: t11, start: "20:20", end: "21:20" }
  - { id: t12, start: "21:30", end: "22:30" }

# 轮换组：同一时间段按天轮换的课程顺序
rotations:
  - name: cs_cycle
    subjects: [cs_ds, cs_os, cs_cn, cs_ca]
    skip_days: [Sunday] # 只跳过周日

# 基础周计划：按星期定义每个时间段默认课程（subject 或 rotation）
# 周一=1，周日=7
weekly_plan:
  1: &daily_plan # 定义一个锚点，代表每日通用计划
    t1: { subject: math }
    t2: { subject: math }
    t3: { subject: eng }
    lunch: { subject: lunch }
    t4: { subject: eng }
    t5: { subject: math }
    t6: { subject: eng, note: "轻松复习 / 听力 / 单词" }
    nap: { subject: nap }
    t7: { rotation: cs_cycle }
    t8: { rotation: cs_cycle }
    t9: { rotation: cs_cycle }
    dinner: { subject: dinner }
    t10: { subject: eng }
    t11: { subject: math }
    t12: { subject: pol }

  # 将周一的计划应用到其他所有天
  2: *daily_plan
  3: *daily_plan
  4: *daily_plan
  5: *daily_plan
  6: *daily_plan
  7: *daily_plan

# 特定日期的临时覆盖（优先级最高），例如法定假日、模拟考试等
date_overrides:
  - date: "2025-12-25" # 示例：圣诞节放假
    all_day_off: true